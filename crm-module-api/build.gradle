plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.tara'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // actuator — /actuator/health 노출. CLAUDE.md/SecurityConfig 가 actuator 를
    // 참조하는데 정작 starter 가 없어 /actuator/health 가 401 이던 문제 수정.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    // Apache POI (Excel)
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // 이미지 → PDF 변환(파일 PDF 변환 기능). 엑셀/워드는 LibreOffice(soffice) 프로세스를 호출한다.
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // 웹 푸시(VAPID) — 아이폰 홈 화면 웹앱·브라우저 활동 알림. BouncyCastle 은 서명 provider
    implementation 'nl.martijndwars:web-push:5.1.2'
    // web-push 가 반환하는 org.apache.http.HttpResponse 용(라이브러리 pom 에선 컴파일 범위가 아님). BouncyCastle 도 optional 이라 직접 넣는다.
    implementation 'org.apache.httpcomponents:httpasyncclient:4.1.5'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'   // web-push 가 요구하는 서명 provider(pom 에선 optional)
    implementation 'org.bitbucket.b_c:jose4j:0.7.9'   // web-push 의 JWT(VAPID) — 같은 이유

    // Lombok
    compileOnly 'org.projectlombok:lombok'

    // Annotation Processors - ORDER MATTERS: Lombok -> MapStruct -> QueryDSL
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    runtimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// QueryDSL Q클래스 생성 경로 설정
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

clean.doLast {
    file(querydslDir).deleteDir()
}
