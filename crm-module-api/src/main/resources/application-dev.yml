# dev 프로파일 — DB/ERP 접속정보는 환경변수로 주입. 비밀번호는 기본값 없음(레포에 시크릿 미보관).
# 로컬 실행 시: export DB_PASSWORD=... ORACLE_PASSWORD=... (또는 IDE 실행 구성/.env).
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:13.125.217.161}:${DB_PORT:3306}/${DB_NAME:crm_module}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_general_ci"

  jpa:
    show-sql: true
    # MariaDB 12.2 + MySQL Connector/J 조합에서 dialect 자동 결정이 깨지는 케이스
    # (Unknown column 'RESERVED' 또는 dialect 미결정). 명시적으로 지정.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

oracle:
  enabled: true
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:39.125.168.136}:${ORACLE_PORT:15253}:${ORACLE_SID:erp10}
    username: ${ORACLE_USERNAME:COMET}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: oracle-hikari

logging:
  level:
    com.tara.crm: DEBUG
