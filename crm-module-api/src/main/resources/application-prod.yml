spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_module}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:sm_user}
    password: ${DB_PASSWORD:sm_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_general_ci"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  # 2026-06-01 — Outlook Direct Send(auth=false) 가 외부 수신자에게 안 가는 문제로
  # Gmail SMTP(앱비밀번호 인증)로 전환. 587 STARTTLS + auth=true.
  # 운영에서는 SMTP_PASSWORD(앱비밀번호) 를 systemd 환경변수로 주입하는 것을 권장.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:taraitspt@gmail.com}
    # 앱비밀번호는 평문 커밋 금지 — 운영 systemd EnvironmentFile 의 SMTP_PASSWORD 로 주입.
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        from: ${SMTP_FROM:taraitspt@gmail.com}

oracle:
  enabled: true
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:39.125.168.136}:${ORACLE_PORT:15253}/${ORACLE_SID:erp10}
    username: ${ORACLE_USERNAME:COMET}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: oracle-hikari

jwt:
  # 운영도 기본값 없음. 예전엔 여기 폴백 키가 소스에 박혀 있어 저장소를 본 사람이면 토큰을 위조할 수 있었다.
  secret: ${JWT_SECRET}
  # 시트 5/13 — 토큰 너무 자주 만료된다는 사용자 보고에 따라 5시간 → 24시간 연장.
  # refresh token 도입 전까지 임시.
  access-token-expiration: 86400000

logging:
  level:
    com.tara.crm: INFO
    org.hibernate.SQL: WARN
