spring:

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret: TEST_SECRET_KEY_FOR_UNIT_TESTING_MUST_BE_AT_LEAST_256_BITS_LONG_FOR_HMAC_SHA
  access-token-expiration: 1800000

integration:
  erp:
    base-url: http://localhost:9999
    api-key: test-key
    timeout: 5
    company-cd: 1000

logging:
  level:
    com.tara.crm: DEBUG
