# CRM 운영 nginx 사이트 — /etc/nginx/sites-available/crm.taratps.com 에 두고 sites-enabled 로 링크한다.
# 화면(정적 파일)은 /var/www/crm, API 는 같은 서버 127.0.0.1:8080 의 Spring Boot 로 넘긴다.
# 화면과 API 가 같은 도메인이라 CORS 가 필요 없고, 앱(APK)도 이 주소의 /m 을 그대로 연다.
# 인증서 경로는 certbot 기본 위치. certbot 이 이미 default 사이트에 넣어 둔 crm.taratps.com 블록은 지운다(중복 server_name 경고).

server {
    listen 80;
    listen [::]:80;
    server_name crm.taratps.com;

    # 인증서 갱신(HTTP-01) — certbot 이 쓴다. 나머지는 전부 https 로.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # 서버 nginx 1.24 — "http2 on;" 은 1.25+ 문법이라 listen 에 붙인다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.taratps.com;

    ssl_certificate     /etc/letsencrypt/live/crm.taratps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.taratps.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # PDF 변환 등 파일 업로드
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    root /var/www/crm;
    index index.html;

    # API — ERP 조회가 길게는 수십 초라 프론트 타임아웃(120초)보다 넉넉히.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 헬스체크만 바깥에 연다(actuator 나머지는 안 연다).
    location = /actuator/health { proxy_pass http://127.0.0.1:8080; }

    # 앱 껍데기·서비스워커·매니페스트는 캐시하지 않는다 — 캐시되면 배포해도 폰이 옛 화면을 붙잡는다.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ ^/(sw\.js|push-sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # Ubuntu mime.types 에 webmanifest 가 없어 octet-stream 으로 나가던 것 — 앱 설치(PWA) 인식용
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 빌드 산출물(해시 파일명)은 오래 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 안드로이드 설치 파일
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA — 없는 경로(/m, /stats/... 등)는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
